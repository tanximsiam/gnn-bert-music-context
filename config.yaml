# Single source of truth for experiment configuration. Avoid hardcoding
# experimental constants elsewhere; read them from here via src/utils.py:load_config.

dataset:
  name: fma_medium          # fma_small | fma_medium
  root: data/raw/fma_medium
  metadata_root: data/raw/fma_metadata
  split: official          # use official FMA split column, no artist leakage
  sample_rate: 22050

audio:
  segment_seconds: 5
  n_mels: 128
  n_mfcc: 20
  use_chroma: true

graph:
  type: segment             # only 'segment' is implemented (src/graph_builder.py); 'chord'
                             # would need a symbolic MIDI source (not used in this project)
  # tau for cosine-similarity edges, computed on per-track z-scored node features.
  # 0.3 was chosen empirically on FMA-medium (~top 10% most-similar segment pairs
  # beyond immediate temporal neighbors); re-tune if features/dataset change.
  similarity_threshold: 0.3
  bidirectional_edges: true
  self_loops: false

bert:
  model_name: distilbert-base-uncased
  max_length: 128
  freeze_layers: all        # all | none | N (unfreeze top N transformer layers)

gnn:
  model: graphsage           # graphsage | gat
  hidden_dim: 128
  num_layers: 3
  dropout: 0.3
  # Genre head uses softmax + CrossEntropyLoss, not the sigmoid/BCE written in the
  # spec's general multi-label equation: FMA genre_top is single-label/mutually
  # exclusive (one genre per track), and softmax+CE is the standard, strictly
  # correct loss for that case (BCE-per-class would treat genres as independent
  # binary decisions, which they are not). See src/train.py:train_task2.

fusion:
  mode: cross_attention       # early_concat | cross_attention

# Optional DEAM valence/arousal auxiliary loss for Task 3 (spec section 4.3).
# Optional DEAM valence/arousal auxiliary loss for Task 3. NOT wired into
# train_task3 (kept disabled): DEAM's official distribution requires manual
# email registration at the dataset owner's site, so it cannot be fetched
# automatically by src/datasets.py:load_deam (still a stub). Flip to true only
# once DEAM audio+annotations are manually placed at dataset_root.
emotion:
  enabled: false
  dataset_root: data/raw/deam
  alpha: 0.1
  beta: 0.1

# Task 4 contrastive retrieval config (MusicCaps).
contrastive:
  enabled: false
  dataset_root: data/raw/musiccaps
  temperature: 0.07
  embed_dim: 128

training:
  seed: 42
  epochs: 30
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
